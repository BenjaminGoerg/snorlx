apiVersion: v1
kind: Secret
metadata:
  name: {{ include "snorlx.secretName" . }}
  labels:
    {{- include "snorlx.labels" . | nindent 4 }}
type: Opaque
data:
  # Generated values are read back from the existing Secret on upgrade, so the database password
  # and the token encryption key do not change under a running release.
  postgres-password: {{ include "snorlx.stableSecret" (dict "ctx" . "key" "postgres-password" "value" .Values.database.password) | quote }}
  session-secret: {{ include "snorlx.stableSecret" (dict "ctx" . "key" "session-secret" "value" .Values.session.secret) | quote }}
  github-client-id: {{ .Values.github.clientId | b64enc | quote }}
  github-client-secret: {{ .Values.github.clientSecret | b64enc | quote }}
  github-webhook-secret: {{ .Values.github.webhookSecret | b64enc | quote }}
