{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "snorlx.serviceAccountName" . }}
  labels:
    {{- include "snorlx.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Snorlx never calls the Kubernetes API: no token is mounted into the pods.
automountServiceAccountToken: false
{{- end }}
